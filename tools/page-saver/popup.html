<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; padding: 12px; font: 13px system-ui, sans-serif; }
  #page { color: #555; margin: 0 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  textarea { width: 100%; box-sizing: border-box; height: 78px; font: inherit; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  button { padding: 6px 14px; font: inherit; }
  #msg { color: #2e7d32; margin-top: 8px; word-break: break-all; }
  #msg.err { color: #c62828; }
  small { color: #777; }
</style>
<p id="page"></p>
<label for="note">What caught your eye? <small>(optional: where the AI should start)</small></label>
<textarea id="note" autofocus placeholder="e.g. 3-year warranty on NUC; PDF card linked under Warranty terms"></textarea>
<div class="row"><button id="save">Save page</button><small>Enter saves, Shift+Enter adds a line</small></div>
<div id="msg" role="status"></div>
<script src="popup.js"></script>
