<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flows</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2430; --mute:#667085; --line:#dfe3ea; --ok:#1a7f4b; --okbg:#e5f5ec; --bad:#b42318; --badbg:#fdeceb; --warn:#8a5a00; --warnbg:#fff4d6; --accent:#2457d6; --chip:#eef2fb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151a; --card:#1b1f27; --ink:#e6e9ef; --mute:#9aa4b5; --line:#2c3340; --ok:#5fd194; --okbg:#173325; --bad:#ff8a80; --badbg:#3a1c1a; --warn:#f0c75e; --warnbg:#37300f; --accent:#7ea2ff; --chip:#222a3b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui, Segoe UI, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line); padding:8px 16px; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
  header h1 { font-size:16px; margin:0 8px 0 0; }
  header label { color:var(--mute); font-size:12px; }
  header input, header select, header button { font:inherit; padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  header button { cursor:pointer; } header a { color:var(--accent); font-size:12px; }
  #tally { font-weight:600; }
  main { max-width:1100px; margin:0 auto; padding:12px 16px 80px; }
  .setup, .band { background:var(--card); border:1px solid var(--line); border-radius:10px; margin:12px 0; overflow:hidden; }
  .setup > summary, .band > summary { list-style:none; cursor:pointer; padding:10px 14px; background:var(--bg); border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:2px 12px; align-items:baseline; }
  summary::-webkit-details-marker { display:none; }
  .num { font-weight:700; color:var(--accent); }
  .band h2, .setup h2 { font-size:15px; margin:0; }
  .sub { flex:1 1 100%; color:var(--mute); font-size:12px; }
  .prog { margin-left:auto; color:var(--mute); font-size:12px; }
  .body { padding:10px 14px 14px; }
  .setup .body li { margin:3px 0; }
  h3 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); margin:12px 0 6px; }
  ol.steps { margin:0; padding:0; list-style:none; counter-reset:s; }
  ol.steps > li { counter-increment:s; display:grid; grid-template-columns:28px 1fr; gap:4px 8px; padding:7px 0; border-top:1px solid var(--line); }
  ol.steps > li:first-child { border-top:0; }
  ol.steps > li::before { content:counter(s); width:22px; height:22px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:12px; font-weight:700; }
  .do { font-weight:500; } .note { color:var(--mute); font-size:12px; }
  .files { display:flex; flex-wrap:wrap; gap:8px; margin-top:5px; grid-column:2; }
  .file { display:flex; gap:8px; align-items:flex-start; background:var(--chip); border:1px solid var(--line); border-radius:8px; padding:5px 8px; max-width:100%; }
  .file img { height:54px; width:auto; border:1px solid var(--line); border-radius:3px; background:#fff; }
  .file .ic { width:54px; height:54px; display:grid; place-items:center; font-size:11px; font-weight:700; color:var(--accent); border:1px solid var(--line); border-radius:3px; background:var(--card); }
  .file b { font:12px ui-monospace, Consolas, monospace; font-weight:600; word-break:break-all; display:block; }
  .file .links { font-size:12px; display:flex; flex-wrap:wrap; gap:2px 10px; margin-top:2px; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .chk { display:grid; grid-template-columns:96px 1fr; gap:4px 12px; padding:7px 0; border-top:1px solid var(--line); }
  .chk:first-of-type { border-top:0; }
  .chk.pass { background:var(--okbg); } .chk.fail { background:var(--badbg); }
  .btns { display:flex; gap:4px; align-items:flex-start; }
  .btns button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:6px; padding:2px 9px; cursor:pointer; font:inherit; }
  .btns button.on.pass { background:var(--ok); color:#fff; border-color:var(--ok); } .btns button.on.fail { background:var(--bad); color:#fff; border-color:var(--bad); }
  .seen { margin-top:3px; font-size:12px; color:var(--mute); } .seen.diff { color:var(--warn); background:var(--warnbg); padding:2px 6px; border-radius:4px; display:inline-block; }
  .seen b { font-weight:600; }
  textarea { width:100%; height:30px; margin-top:4px; font:inherit; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:3px 6px; background:var(--card); color:var(--ink); resize:vertical; }
  .tag { font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:1px 7px; border-radius:10px; background:var(--chip); color:var(--accent); }
  .tag.run { background:var(--okbg); color:var(--ok); } .tag.exp { background:var(--warnbg); color:var(--warn); }
  @media (max-width:760px) { .chk { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>How items flow in</h1>
  <span id="tally"></span>
  <label>Show <select id="filter"><option value="all">everything</option><option value="todo">unchecked</option><option value="fail">failed</option></select></label>
  <label>App <input id="app" size="22" title="Where the StuffIt UI runs"></label>
  <button id="collapse">Collapse all</button><button id="expand">Expand all</button>
  <button id="export">Export results</button><button id="reset">Reset</button>
  <a href="test-matrix.html">File-by-file matrix</a><a href="key-viewer.html">Receipt runner</a><a href="warranty-viewer.html">Documents runner</a>
</header>
<main id="main"></main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const F = (path, how) => ({ path, how });   // how: a hint for the documents page: waiting | kept | looseWaiting | looseKept | looseNone

const SETUP = [
  'A test user. Use <b>Clear New Items</b> on the documents page (it removes everything in New Items, yours included) or dismiss and delete by hand, so each flow starts empty.',
  'A registered card <b>ending 4242</b>: Chase, product <b>Chase Sapphire Preferred</b>, and in the card settings <b>confirm both proposed benefits</b> (extended warranty +12 months up to 48, purchase protection). The email and invoice samples (Amazon, Apple, Best Buy, Wayfair, the Home Depot pair) are all paid with 4242. The other samples use 1212 (Bank of America card already on the test user), 1111, 5454 and 7711.',
  'To count as <b>verified</b>, a policy needs a confidence of 85% or more. The seeded maker policies (Milwaukee, DeWalt, Apple and the rest) are <b>75% "likely"</b>, read from the web on Sep 30, and a quick add attaches only what is <b>80% or more</b>. For the flows that expect a maker warranty on a quick add, first add an official-source evidence row to the Milwaukee and DeWalt manufacturer policies (admin, policy evidence). Until then expect the "Seen" notes below.',

];

const FLOWS = [
  {
    id: 'F1', title: 'Order email, then a photo of the receipt: known brands, registered card', tag: 'run',
    sub: 'The main path. Home Depot pickup order H12345-67890: a Milwaukee hammer drill and a DeWalt circular saw, paid with the registered 4242 card. I made receipt 104 to pair with this email.',

      { do: 'Upload the order confirmation email (New Items, add a file).', files: [F('emails/order-confirmation/homedepot-order-confirmation-02.eml')] },

    ],

      { t: 'Fields are filled and agree: store Home Depot, maker Milwaukee, model 2904-22, price 199.00, date 2026-08-12, order H12345-67890.', seen: 'All filled. Nothing missing, nothing to check.' },
      { t: 'The card 4242 is matched to the registered card.', seen: 'Matched (shown by its nickname).' },

    ],
    confirm: [
      { t: 'Three New Items from the email (Anker, Ninja, Cuisinart); the invoice joins them.', seen: 'Three items. The Anker item holds both documents. I did not look at the other two.' },

      { do: 'Home Depot: after the F1 email, the in-store receipt that has no order number.', files: [F('receipts/pdf-as-jpg/homedepot-receipt-01.jpg')], note: 'It lists the same Milwaukee drill and DeWalt saw.' },
    ],
    confirm: [

    ],

      { t: 'The 1212 receipt is linked to the card and lists the card\'s extended warranty (maker term 12 months, so +12).' },

const KEY = 't2-flow-results';
let res = {}; try { res = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { res = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(res)); } catch { } };
const app = () => ($('app').value || 'http://localhost:4200').replace(/\/$/, '');
const nameOf = p => p.replace(/^.*\//, '');
const isImg = p => /\.(jpg|png)$/i.test(p);

function fileChip(f) {
  const base = nameOf(f.path).replace(/\.(pdf|jpg|png|eml)$/i, ''), links = [`<a href="sample/${f.path}" target="_blank">Open</a>`];
  if (/^receipts\/pdf-as-jpg\/.+\.jpg$/.test(f.path)) links.push(`<a href="key-viewer.html?file=${encodeURIComponent(base)}" target="_blank">Key viewer</a>`);
  if (/^warranties-from-receipts(-photo)?\//.test(f.path) && f.how) links.push(`<a href="warranty-viewer.html?doc=${encodeURIComponent(base)}&mode=${f.how}&fmt=${f.path.endsWith('.jpg') ? 'jpg' : 'pdf'}" target="_blank">Documents page</a>`);
  const thumb = isImg(f.path) ? `<a href="sample/${f.path}" target="_blank"><img loading="lazy" src="sample/${f.path}" alt=""></a>` : `<div class="ic">${/\.eml$/i.test(f.path) ? 'EMAIL' : 'PDF'}</div>`;
  return `<div class="file">${thumb}<div><b>${esc(f.path)}</b><div class="links">${links.join('')}</div></div></div>`;
}
const cid = (fl, i) => fl.id + '-' + (i + 1);
function flowHtml(fl, shown) {
  const rows = fl.confirm.map((c, i) => {
    const id = cid(fl, i), s = res[id] || {};
    if (shown === 'todo' && s.r) return ''; if (shown === 'fail' && s.r !== 'fail') return '';
    const b = k => `<button class="${k}${s.r === k ? ' on ' + k : ''}" data-id="${id}" data-r="${k}">${k === 'pass' ? '✓ Yes' : '✗ No'}</button>`;
    return `<div class="chk ${s.r || ''}" data-id="${id}"><div class="btns">${b('pass')}${b('fail')}</div><div><div>${c.t}</div>${c.seen ? `<div class="seen ${c.diff ? 'diff' : ''}"><b>Live run 2026-10-21:</b> ${esc(c.seen)}</div>` : ''}<textarea data-note="${id}" placeholder="What you saw">${esc(s.n || '')}</textarea></div></div>`;
  }).join('');
  if (!rows && shown !== 'all') return '';
  const done = fl.confirm.filter((c, i) => (res[cid(fl, i)] || {}).r === 'pass').length, bad = fl.confirm.filter((c, i) => (res[cid(fl, i)] || {}).r === 'fail').length;
  return `<details class="band" data-id="${fl.id}" ${open.has(fl.id) || shown !== 'all' ? 'open' : ''}>
    <summary><span class="num">${fl.id}</span><h2>${esc(fl.title)}</h2><span class="tag ${fl.tag}">${fl.tag === 'run' ? 'run live' : 'not run yet'}</span><span class="prog">${done}/${fl.confirm.length} confirmed${bad ? ` · <b style="color:var(--bad)">${bad} failed</b>` : ''}</span><span class="sub">${esc(fl.sub)}</span></summary>
    <div class="body"><h3>Steps</h3><ol class="steps">${fl.steps.map(s => `<li><div><div class="do">${esc(s.do)}</div>${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}</div><div class="files">${s.files.map(fileChip).join('')}</div></li>`).join('')}</ol>
    <h3>Confirm</h3>${rows}<div class="note" style="margin-top:8px">Look in <a href="${app()}/add" target="_blank">New Items</a>, open the item to see its coverage, then <a href="${app()}/items" target="_blank">My Items</a> after the quick add.</div></div></details>`;
}
const open = new Set(['F1']);
function paint() {
  const shown = $('filter').value;
  $('main').innerHTML = `<details class="setup" open><summary><h2>Before you start</h2></summary><div class="body"><ul>${SETUP.map(s => `<li>${s}</li>`).join('')}</ul></div></details>` + FLOWS.map(f => flowHtml(f, shown)).join('');
  tally();
}
function tally() {
  let p = 0, f = 0, n = 0; for (const fl of FLOWS) fl.confirm.forEach((c, i) => { n++; const r = (res[cid(fl, i)] || {}).r; if (r === 'pass') p++; if (r === 'fail') f++; });
  $('tally').textContent = `${p} ✓ · ${f} ✗ · ${n - p - f} unchecked, of ${n}`;
}
$('main').addEventListener('click', e => {
  const b = e.target.closest('button[data-r]'); if (!b) return;
  const id = b.dataset.id, k = b.dataset.r; res[id] = res[id] || {};
  if (res[id].r === k) delete res[id].r; else res[id].r = k;
  save(); paint();
});
$('main').addEventListener('input', e => { const id = e.target.dataset.note; if (!id) return; res[id] = res[id] || {}; res[id].n = e.target.value; save(); });
$('main').addEventListener('toggle', e => { const id = e.target.dataset && e.target.dataset.id; if (id && e.target.classList.contains('band')) { if (e.target.open) open.add(id); else open.delete(id); } }, true);
$('filter').onchange = paint;
$('app').value = (() => { try { return localStorage.getItem('t2-app') || 'http://localhost:4200'; } catch { return 'http://localhost:4200'; } })();
$('app').onchange = () => { try { localStorage.setItem('t2-app', $('app').value); } catch { } paint(); };
$('collapse').onclick = () => { open.clear(); document.querySelectorAll('.band').forEach(d => d.open = false); };
$('expand').onclick = () => document.querySelectorAll('.band').forEach(d => { d.open = true; open.add(d.dataset.id); });
$('reset').onclick = () => { if (confirm('Forget every check and note saved in this browser?')) { res = {}; save(); paint(); } };
$('export').onclick = () => {
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"', lines = ['flow,check,result,note,expected,live_run_2026_10_21'];
  for (const fl of FLOWS) fl.confirm.forEach((c, i) => { const s = res[cid(fl, i)] || {}; lines.push([fl.id + ' ' + fl.title, cid(fl, i), s.r === 'pass' ? 'yes' : s.r === 'fail' ? 'no' : '', s.n || '', c.t.replace(/<[^>]+>/g, ''), c.seen || ''].map(q).join(',')); });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n') + '\n'], { type: 'text/csv' })); a.download = 'flow-results-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
};
paint();
</script>
</body>
</html>
