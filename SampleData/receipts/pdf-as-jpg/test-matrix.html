<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test matrix</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2430; --mute:#667085; --line:#dfe3ea; --ok:#1a7f4b; --okbg:#e5f5ec; --bad:#b42318; --badbg:#fdeceb; --skip:#8a6d00; --skipbg:#fff6d6; --gap:#f3ecff; --accent:#2457d6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151a; --card:#1b1f27; --ink:#e6e9ef; --mute:#9aa4b5; --line:#2c3340; --ok:#5fd194; --okbg:#173325; --bad:#ff8a80; --badbg:#3a1c1a; --skip:#f0c75e; --skipbg:#37300f; --gap:#2a2140; --accent:#7ea2ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, Segoe UI, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line); padding:8px 16px; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
  header h1 { font-size:16px; margin:0 8px 0 0; }
  header label { color:var(--mute); font-size:12px; }
  header input, header select, header button { font:inherit; padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  header button { cursor:pointer; }
  #tally { font-weight:600; }
  #bar { height:6px; flex:1 1 100%; background:var(--line); border-radius:3px; overflow:hidden; display:flex; }
  #bar i { display:block; height:100%; }
  main { max-width:1180px; margin:0 auto; padding:12px 16px 80px; }
  .band { background:var(--card); border:1px solid var(--line); border-radius:10px; margin:12px 0; overflow:hidden; }
  .band > summary { list-style:none; cursor:pointer; padding:10px 14px; display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; background:var(--bg); border-bottom:1px solid var(--line); }
  .band > summary::-webkit-details-marker { display:none; }
  .band h2 { font-size:15px; margin:0; }
  .grp { font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--accent); }
  .prog { margin-left:auto; color:var(--mute); font-size:12px; }
  .before { flex:1 1 100%; color:var(--mute); font-size:12px; }
  .gap { background:var(--gap); }
  .row { display:grid; grid-template-columns:120px 62px 1fr 280px; gap:6px 12px; padding:8px 14px; border-top:1px solid var(--line); align-items:start; }
  .row:first-of-type { border-top:0; }
  .row.pass { background:var(--okbg); } .row.fail { background:var(--badbg); } .row.skip { background:var(--skipbg); }
  .btns { display:flex; gap:4px; }
  .btns button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:6px; padding:2px 8px; cursor:pointer; font:inherit; }
  .btns button.on.pass { background:var(--ok); color:#fff; border-color:var(--ok); }
  .btns button.on.fail { background:var(--bad); color:#fff; border-color:var(--bad); }
  .btns button.on.skip { background:var(--skip); color:#fff; border-color:var(--skip); }
  .id { font-size:11px; color:var(--mute); margin-top:4px; word-break:break-all; }
  .fmt { font-size:11px; padding:1px 6px; border-radius:10px; border:1px solid var(--line); color:var(--mute); white-space:nowrap; }
  .fmt.photo { color:var(--accent); border-color:var(--accent); }
  .what a, .acts a { color:var(--accent); text-decoration:none; } .what a:hover, .acts a:hover { text-decoration:underline; }
  .file { font-family:ui-monospace, Consolas, monospace; font-size:12px; word-break:break-all; }
  .expect { margin-top:3px; }
  .mode { color:var(--mute); font-size:12px; margin-top:2px; }
  .acts { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12px; }
  .acts .primary { font-weight:600; }
  .thumb { display:block; margin-top:4px; max-height:46px; border:1px solid var(--line); border-radius:4px; }
  textarea { width:100%; height:34px; margin-top:4px; font:inherit; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:3px 6px; background:var(--card); color:var(--ink); resize:vertical; }
  .empty { color:var(--mute); padding:40px; text-align:center; }
  @media (max-width: 820px) { .row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Test matrix</h1>
  <span id="tally"></span>
  <label>Show <select id="filter"><option value="all">everything</option><option value="todo">not run</option><option value="fail">differs</option><option value="pass">passed</option><option value="skip">skipped</option><option value="gap">known gaps only</option></select></label>
  <label>Group <select id="group"><option value="">all</option></select></label>
  <label>Search <input id="q" placeholder="file, store, model" size="18"></label>
  <label>App <input id="app" size="22" title="Where the StuffIt UI runs"></label>
  <button id="collapse">Collapse all</button><button id="expand">Expand all</button>
  <button id="export" title="Download the matrix CSV with your results and notes filled in">Export CSV</button>
  <button id="reset" title="Forget every result saved in this browser">Reset results</button>
  <div id="bar"></div>
</header>
<main id="main"><div class="empty">Loading the matrix…</div></main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function parseCsv(text) {
  text = text.replace(/^﻿/, ''); const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur.replace(/\r$/, '')); rows.push(row); row = []; cur = ''; } else cur += c; }
  if (cur || row.length) { row.push(cur.replace(/\r$/, '')); rows.push(row); }
  const head = rows.shift(); return rows.filter(r => r.length > 1).map(r => Object.fromEntries(head.map((h, i) => [h, r[i] || ''])));
}
const KEY = 't2-matrix-results';
let rows = [], res = {};
try { res = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { res = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(res)); } catch { } };
const appBase = () => ($('app').value || 'http://localhost:4200').replace(/\/$/, '');
const isGap = r => /KNOWN GAP|NOT BUILT|known gap/i.test(r.scenario + ' ' + r.expect);
const nameOf = f => f.replace(/^.*\//, '').replace(/\.(pdf|jpg|png)$/i, '');
const pathsIn = s => (s.match(/(?:receipts|warranties)[\w\-./]*\.(?:pdf|jpg|png)/g) || []);
const isImg = f => /\.(jpg|png)$/i.test(f);

/* the links on a row: open the runner on this file, the file itself, and the app pages to do it by hand */
function actions(r) {
  const out = [], A = appBase(), files = pathsIn(r.file);
  const modeOf = r.mode.split(':')[0];
  const wmode = { W: 'waiting', K: 'kept', LW: 'looseWaiting', LK: 'looseKept', LN: 'looseNone' }[modeOf];
  const isDoc = /^warranties-from-receipts(-photo)?\//.test(r.file);
  const isReceipt = /^receipts\/pdf-as-jpg\//.test(r.file) && r.group === 'A receipts';
  if (isDoc && wmode) out.push(`<a class="primary" href="warranty-viewer.html?doc=${encodeURIComponent(nameOf(r.file))}&mode=${wmode}&fmt=${/photo/.test(r.file) ? 'jpg' : 'pdf'}" target="_blank">Run in documents page</a>`);
  if (isReceipt) out.push(`<a class="primary" href="key-viewer.html?file=${encodeURIComponent(nameOf(r.file))}" target="_blank">Open in key viewer</a>`);
  for (const f of files) out.push(`<a href="sample/${f}" target="_blank">${files.length > 1 ? esc(nameOf(f).slice(0, 22)) : 'Open file'}</a>`);
  out.push(`<a href="${A}/add" target="_blank">New Items</a><a href="${A}/items" target="_blank">My Items</a>`);
  return out.join('');
}
function rowHtml(r) {
  const s = res[r.id] || {}, files = pathsIn(r.file), single = files.length === 1 && files[0] === r.file;
  const fileCell = single ? `<a href="sample/${r.file}" target="_blank">${esc(r.file)}</a>` : esc(r.file);
  const thumb = single && isImg(r.file) ? `<a href="sample/${r.file}" target="_blank"><img class="thumb" loading="lazy" src="sample/${r.file}" alt=""></a>` : '';
  const btn = (k, t) => `<button class="${k}${s.r === k ? ' on ' + k : ''}" data-id="${esc(r.id)}" data-r="${k}" title="${t}">${{ pass: '✓', fail: '✗', skip: '–' }[k]}</button>`;
  return `<div class="row ${s.r || ''}" data-id="${esc(r.id)}">
    <div><div class="btns">${btn('pass', 'Matches what is expected')}${btn('fail', 'Differs: say how in the notes')}${btn('skip', 'Not tested now')}</div><div class="id">${esc(r.id)}</div></div>
    <div><span class="fmt ${/photo/.test(r.format) ? 'photo' : ''}">${esc(r.format)}</span></div>
    <div class="what"><div class="file">${fileCell}</div><div class="expect">${esc(r.expect)}</div><div class="mode">${esc(r.mode)}${r.runner ? ' · ' + esc(r.runner) : ''}</div>${thumb}</div>
    <div><div class="acts">${actions(r)}</div><textarea data-note="${esc(r.id)}" placeholder="Notes">${esc(s.n || '')}</textarea></div></div>`;
}
function matches(r) {
  const f = $('filter').value, g = $('group').value, q = $('q').value.trim().toLowerCase(), s = (res[r.id] || {}).r || '';
  if (g && r.group !== g) return false;
  if (f === 'todo' && s) return false;
  if (['pass', 'fail', 'skip'].includes(f) && s !== f) return false;
  if (f === 'gap' && !isGap(r)) return false;
  if (q && !(r.file + ' ' + r.expect + ' ' + r.scenario + ' ' + r.id).toLowerCase().includes(q)) return false;
  return true;
}
const open = new Set();
function paint() {
  const bands = new Map();
  for (const r of rows) { const k = r.group + '|' + r.scenario; if (!bands.has(k)) bands.set(k, { group: r.group, scenario: r.scenario, rows: [] }); bands.get(k).rows.push(r); }
  let html = '', shown = 0;
  for (const [k, b] of bands) {
    const mine = b.rows.filter(matches); if (!mine.length) continue; shown += mine.length;
    const done = b.rows.filter(r => (res[r.id] || {}).r === 'pass').length, bad = b.rows.filter(r => (res[r.id] || {}).r === 'fail').length;
    const before = [...new Set(b.rows.map(r => r.before))].slice(0, 2).join(' · ');
    html += `<details class="band${b.rows.every(isGap) ? ' gap' : ''}" data-k="${esc(k)}" ${open.has(k) || $('q').value || $('filter').value !== 'all' ? 'open' : ''}>
      <summary><span class="grp">${esc(b.group)}</span><h2>${esc(b.scenario)}</h2><span class="prog">${done}/${b.rows.length} passed${bad ? ` · <b style="color:var(--bad)">${bad} differ</b>` : ''}</span><span class="before">Start with: ${esc(before)}</span></summary>
      ${mine.map(rowHtml).join('')}</details>`;
  }
  $('main').innerHTML = html || '<div class="empty">Nothing matches.</div>';
  tally();
}
function tally() {
  const c = { pass: 0, fail: 0, skip: 0 }; for (const r of rows) { const s = (res[r.id] || {}).r; if (s) c[s]++; }
  const n = rows.length, todo = n - c.pass - c.fail - c.skip;
  $('tally').textContent = `${c.pass} ✓ · ${c.fail} ✗ · ${c.skip} skipped · ${todo} not run, of ${n}`;
  $('bar').innerHTML = `<i style="width:${c.pass / n * 100}%;background:var(--ok)"></i><i style="width:${c.fail / n * 100}%;background:var(--bad)"></i><i style="width:${c.skip / n * 100}%;background:var(--skip)"></i>`;
}
$('main').addEventListener('click', e => {
  const b = e.target.closest('button[data-r]'); if (!b) return;
  const id = b.dataset.id, k = b.dataset.r; res[id] = res[id] || {};
  if (res[id].r === k) delete res[id].r; else { res[id].r = k; res[id].at = new Date().toISOString().slice(0, 16).replace('T', ' '); }
  save(); const row = b.closest('.row'); row.className = 'row ' + (res[id].r || '');
  row.querySelectorAll('.btns button').forEach(x => x.className = x.dataset.r + (res[id].r === x.dataset.r ? ' on ' + x.dataset.r : ''));
  const band = b.closest('.band'), mine = rows.filter(r => (r.group + '|' + r.scenario) === band.dataset.k);
  const done = mine.filter(r => (res[r.id] || {}).r === 'pass').length, bad = mine.filter(r => (res[r.id] || {}).r === 'fail').length;
  band.querySelector('.prog').innerHTML = `${done}/${mine.length} passed${bad ? ` · <b style="color:var(--bad)">${bad} differ</b>` : ''}`; tally();
});
$('main').addEventListener('input', e => { const id = e.target.dataset.note; if (!id) return; res[id] = res[id] || {}; res[id].n = e.target.value; save(); });
$('main').addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.k; if (k) { if (e.target.open) open.add(k); else open.delete(k); } }, true);
['filter', 'group'].forEach(id => $(id).onchange = paint); $('q').oninput = paint;
$('app').value = (() => { try { return localStorage.getItem('t2-app') || 'http://localhost:4200'; } catch { return 'http://localhost:4200'; } })();
$('app').onchange = () => { try { localStorage.setItem('t2-app', $('app').value); } catch { } paint(); };
$('collapse').onclick = () => { open.clear(); document.querySelectorAll('.band').forEach(d => d.open = false); };
$('expand').onclick = () => document.querySelectorAll('.band').forEach(d => { d.open = true; open.add(d.dataset.k); });
$('reset').onclick = () => { if (confirm('Forget every result and note saved in this browser?')) { res = {}; save(); paint(); } };
$('export').onclick = () => {
  const cols = Object.keys(rows[0]), q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const label = { pass: 'pass', fail: 'differs', skip: 'skipped' };
  const lines = rows.map(r => cols.map(c => q(c === 'result' ? (label[(res[r.id] || {}).r] || '') : c === 'notes' ? ((res[r.id] || {}).n || '') : r[c])).join(','));
  const blob = new Blob(['﻿' + cols.join(',') + '\n' + lines.join('\n') + '\n'], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'T2-test-matrix-results-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
};
(async function init() {
  try {
    const r = await fetch('testing/T2-test-matrix.csv', { cache: 'no-store' }); if (!r.ok) throw new Error(r.status);
    rows = parseCsv(await r.text());
  } catch (e) { $('main').innerHTML = `<div class="empty">Could not load testing/T2-test-matrix.csv (${esc(e.message)}). Open this page through serve-viewer.py at http://localhost:8765/test-matrix.html.</div>`; return; }
  [...new Set(rows.map(r => r.group))].forEach(g => $('group').insertAdjacentHTML('beforeend', `<option>${esc(g)}</option>`));
  paint();
})();
</script>
</body>
</html>
